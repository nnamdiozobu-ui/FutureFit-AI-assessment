[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "futurefit-career-analytics"
version = "0.1.0"
description = "FutureFit AI data engineering take-home assessment"
requires-python = ">=3.11,<3.12"
dependencies = [
  "duckdb==1.0.0",
  "pandas==2.1.4",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
